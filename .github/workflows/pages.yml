name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/personal-health-pwa-e0qi9p]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement 는 저장소에 Pages 가 꺼져 있을 때 워크플로가 켜 보게 한다.
      # 다만 Actions 기본 토큰에는 "Pages 사이트를 처음 만드는" 권한이 없어
      # 최초 1회는 사람이 Settings → Pages 에서 켜 줘야 한다(아래 안내 참고).
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Pages 가 꺼져 있을 때 안내
        if: failure() && steps.pages.outcome == 'failure'
        run: |
          echo "::error::Pages 가 아직 켜져 있지 않습니다."
          echo "Settings → Pages → Build and deployment → Source 를 'GitHub Actions' 로 바꾼 뒤"
          echo "이 워크플로를 다시 실행하면 배포됩니다. 최초 1회만 필요합니다."

      # 주력 배포는 베르셀이다. 두 주소가 동시에 살아 있으면 설치한 곳에 따라
      # 기록이 갈라지므로(브라우저 저장소는 도메인마다 따로다), 이 주소에는
      # 새 주소 안내와 "남은 기록 내려받기"만 올린다.
      - name: 안내 페이지만 모은다
        run: |
          mkdir -p _site
          cp moved/index.html _site/index.html
          cp moved/sw.js _site/sw.js   # 예전 서비스워커를 스스로 걷어내게 한다
          cp -r assets _site/
          touch _site/.nojekyll
          find _site -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
