name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/personal-health-pwa-e0qi9p]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement 는 저장소에 Pages 가 꺼져 있을 때 워크플로가 켜 보게 한다.
      # 다만 Actions 기본 토큰에는 "Pages 사이트를 처음 만드는" 권한이 없어
      # 최초 1회는 사람이 Settings → Pages 에서 켜 줘야 한다(아래 안내 참고).
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Pages 가 꺼져 있을 때 안내
        if: failure() && steps.pages.outcome == 'failure'
        run: |
          echo "::error::Pages 가 아직 켜져 있지 않습니다."
          echo "Settings → Pages → Build and deployment → Source 를 'GitHub Actions' 로 바꾼 뒤"
          echo "이 워크플로를 다시 실행하면 배포됩니다. 최초 1회만 필요합니다."

      - name: 올릴 것만 모은다
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r css js assets _site/
          mkdir -p _site/landing
          cp landing/index.html landing/index.single.html landing/tokens.css \
             landing/motion.css landing/motion.js _site/landing/
          cp -r landing/shots _site/landing/
          touch _site/.nojekyll
          echo "— 배포 목록 —" && find _site -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
